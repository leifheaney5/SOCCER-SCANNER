# XcodeGen specification.
#
# The .xcodeproj is generated rather than committed: a hand-maintained pbxproj
# is unreviewable and merge-hostile. CI runs `xcodegen generate` before
# building, so this file is the source of truth.
name: SoccerScanner
options:
  bundleIdPrefix: $(APPLE_BUNDLE_PREFIX)
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Signing is supplied by CI (fastlane match / App Store Connect API key)
    # so the repository never contains a team identifier.
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)

targets:
  SoccerScanner:
    type: application
    platform: iOS
    sources:
      - path: SoccerScanner
    info:
      path: SoccerScanner/Info.plist
      properties:
        CFBundleDisplayName: Soccer Scanner
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Soccer Scanner
    entitlements:
      path: SoccerScanner/SoccerScanner.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:soccerscanner.pro

  SoccerScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoccerScannerTests
    dependencies:
      - target: SoccerScanner

  SoccerScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SoccerScannerUITests
    dependencies:
      - target: SoccerScanner

schemes:
  SoccerScanner:
    build:
      targets:
        SoccerScanner: all
    test:
      gatherCoverageData: true
      targets:
        - SoccerScannerTests
        - SoccerScannerUITests
    run:
      environmentVariables:
        SOCCER_SCANNER_ENVIRONMENT: development
