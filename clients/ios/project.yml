# XcodeGen specification.
#
# The .xcodeproj is generated rather than committed: a hand-maintained pbxproj
# is unreviewable and merge-hostile. CI runs `xcodegen generate` before
# building, so this file is the source of truth.
name: SoccerScanner
options:
  bundleIdPrefix: pro.soccerscanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # No DEVELOPMENT_TEAM here: the repository must not contain an Apple team
    # identifier. Release builds pass it on the xcodebuild command line, and
    # simulator test runs build with signing disabled entirely.
    CODE_SIGN_STYLE: Manual

targets:
  SoccerScanner:
    type: application
    platform: iOS
    sources:
      - path: SoccerScanner
    info:
      path: SoccerScanner/Info.plist
      properties:
        CFBundleDisplayName: Soccer Scanner
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # A concrete identifier: `$(APPLE_BUNDLE_ID)` is not a defined build
        # setting, so it expanded to an empty string and the simulator refused
        # to install the app. Release builds override this on the command line
        # if the registered bundle ID differs.
        PRODUCT_BUNDLE_IDENTIFIER: pro.soccerscanner.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Soccer Scanner
    entitlements:
      path: SoccerScanner/SoccerScanner.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:soccerscanner.pro

  SoccerScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoccerScannerTests
    dependencies:
      - target: SoccerScanner

  SoccerScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SoccerScannerUITests
    dependencies:
      - target: SoccerScanner

schemes:
  SoccerScanner:
    build:
      targets:
        SoccerScanner: all
    test:
      gatherCoverageData: true
      targets:
        - SoccerScannerTests
        - SoccerScannerUITests
    run:
      environmentVariables:
        SOCCER_SCANNER_ENVIRONMENT: development
