name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: pip install pytest pip-audit
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: python -m compileall -q app.py wsgi.py soccer_scanner
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - name: Check every JavaScript file
        run: find static tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm run test:smoke-invariants
      - run: npm audit --audit-level=high
      - run: pip-audit -r requirements.txt
      - run: npx playwright test --project=chromium --project=webkit
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload safe browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
