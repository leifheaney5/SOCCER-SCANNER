name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py wsgi.py soccer_scanner
      - run: python -m unittest discover -s tests -v
      - run: node --check static/js/dom.js
      - run: node --check static/js/fixtures.js
      - run: node --check static/js/teams.js
      - run: node --check static/js/standings.js
