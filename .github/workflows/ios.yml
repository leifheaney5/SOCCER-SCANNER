name: iOS

permissions:
  contents: read

# Builds, tests and (on demand) ships the native client.
#
# This runs on macOS runners because Xcode, xcodebuild and the App Store upload
# tooling are macOS-only. It is the verification path for the iOS client: the
# project cannot be compiled on a Windows or Linux developer machine.

on:
  push:
    paths:
      - 'clients/ios/**'
      - 'templates/terms.html'
      - 'tests/test_ios_release_assets.py'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'clients/ios/**'
      - 'templates/terms.html'
      - 'tests/test_ios_release_assets.py'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Release lane to run after tests'
        required: true
        default: 'none'
        type: choice
        options: [none, beta, release_upload, release_submit]

# Push and pull_request runs supersede older runs on the same ref. Manual
# (workflow_dispatch) release runs share one queue and are never cancelled, so
# a merge to main cannot abort a TestFlight upload or App Store submission.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ios-release' || format('ios-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml
        env:
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID || 'com.leifheaney.soccerradar' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
          APPLE_BUNDLE_PREFIX: com.leifheaney

      - name: Validate generated build settings
        run: |
          mkdir -p build
          xcodebuild -project SoccerScanner.xcodeproj -scheme SoccerScanner -showBuildSettings \
            > build/build-settings.txt
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.leifheaney.soccerradar' build/build-settings.txt
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET = 17.0' build/build-settings.txt
          grep -Fq 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon' build/build-settings.txt

      - name: Validate the privacy manifest
        run: plutil -lint SoccerScanner/PrivacyInfo.xcprivacy SoccerScanner/SoccerScanner.entitlements

      - name: Validate source release assets
        run: python3 ../../tests/test_ios_release_assets.py

      - name: Select an available simulator
        id: simulator
        # Pinning a device name or runtime breaks whenever the runner image
        # changes, so resolve a numeric-newest iPhone from what is installed.
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, runpy, sys
          module = runpy.run_path('Tools/select_simulator.py')
          udid, name, runtime = module['select_simulator'](json.load(sys.stdin))
          print(udid)
          sys.stderr.write(f'selected {name} on {runtime}\n')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # Signing is disabled for simulator test runs so pull requests from
        # forks do not need signing secrets.
        run: |
          set -o pipefail
          mkdir -p build
          status=0
          set +e
          for scheme in SoccerScanner SoccerScannerUnitTests; do
            result_bundle="build/${scheme}-TestResults.xcresult"
            if [ "$scheme" = "SoccerScanner" ]; then
              tee_command="tee build/xcodebuild.log"
            else
              tee_command="tee -a build/xcodebuild.log"
            fi
            xcodebuild test \
              -project SoccerScanner.xcodeproj \
              -scheme "$scheme" \
              -destination "id=${{ steps.simulator.outputs.udid }}" \
              -resultBundlePath "$result_bundle" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              2>&1 | $tee_command
            current_status=${PIPESTATUS[0]}
            if [ "$current_status" -ne 0 ]; then
              status="$current_status"
            fi
          done
          set -e
          exit "$status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: clients/ios/build/
          retention-days: 7
          if-no-files-found: ignore

  release:
    # Only runs when a lane is explicitly requested, never automatically.
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.lane != 'none'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: app-store
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: clients/ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run the requested lane
        run: bundle exec fastlane ${{ inputs.lane }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_BUNDLE_PREFIX: com.leifheaney
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
