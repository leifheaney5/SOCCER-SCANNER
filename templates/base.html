<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>{% block title %}Soccer Scanner{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;family=Orbitron:wght@600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css', v='20260803-dashboard-v1') }}">
    {% block page_styles %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="app-header">
        <div class="nav-container">
            <a class="app-title" href="/" aria-label="Soccer Scanner home">
                <span>SOCCER</span><span class="app-title-accent">SCANNER</span>
            </a>
            <nav class="nav-links" aria-label="Primary navigation">
                <a href="/" class="nav-link{% if request.path in ['/', '/matches-today'] %} active{% endif %}"{% if request.path in ['/', '/matches-today'] %} aria-current="page"{% endif %}>Fixtures</a>
                <a class="nav-link nav-link-external" href="https://select-xi.pro/" target="_blank" rel="noopener noreferrer">
                    Select XI
                    <span aria-hidden="true">↗</span>
                </a>
            </nav>
            {% block header_actions %}{% endblock %}
        </div>
    </header>
    <main id="main-content">{% block content %}{% endblock %}</main>
    <script src="{{ url_for('static', filename='js/dom.js', v='20260803-dashboard-v1') }}" defer></script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
