{% extends "base.html" %}

{% block title %}Team Intelligence | Soccer Scanner{% endblock %}
{% block content %}
<article class="content-page team-profile" data-team-id="{{ canonical_id }}">
    <p class="eyebrow">Team intelligence</p>
    <h1 id="team-page-title">Loading team</h1>
    <p id="team-page-status" role="status">Loading verified club data</p>
    <dl id="team-page-facts"></dl>
    <p><a href="/?q={{ canonical_id|replace('-', '+') }}">Find this team’s fixtures</a></p>
</article>
{% endblock %}
{% block page_scripts %}<script type="module" src="{{ url_for('static', filename='js/team-page.js', v=build.assetVersion) }}"></script>{% endblock %}
